services:
  postgres:
    image: postgres:16-alpine
    container_name: atletatrack_postgres
    environment:
      POSTGRES_USER: atletatrack
      POSTGRES_PASSWORD: atletatrack
      POSTGRES_DB: atletatrack
    # Postgres acessível apenas pela rede interna do compose (evita conflito de porta no host)
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atletatrack -d atletatrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: atletatrack_backend
    # Adicionamos esta linha para o Node.js "ver" o serviço Python no Windows
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://atletatrack:atletatrack@postgres:5432/atletatrack?schema=public
      PORT: 3333
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # URL do microserviço de IA (fv-categorizing). Em prod aponte para o host/serviço real.
      CATEGORIZER_URL: ${CATEGORIZER_URL:-http://host.docker.internal:8000}
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npm run start"

  frontend:
    build:
      context: ./frontend
      args:
        # Em prod: defina VITE_API_URL no ambiente antes do build (ex.: https://api.seu-dominio.com/api)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333/api}
    container_name: atletatrack_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
