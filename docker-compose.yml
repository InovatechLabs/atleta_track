version: "3.9"

services:
  # ===== PostgreSQL (RP02) =====
  db:
    image: postgres:16-alpine
    container_name: atletatrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: atletatrack
      POSTGRES_USER: atletatrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atletatrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atletatrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== Redis (RP02) =====
  redis:
    image: redis:7-alpine
    container_name: atletatrack-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===== Backend FastAPI (RP02) =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atletatrack-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://atletatrack:${DB_PASSWORD:-atletatrack}@db:5432/atletatrack
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - model_cache:/app/.model_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Celery Worker (tarefas assíncronas de ML) =====
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atletatrack-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://atletatrack:${DB_PASSWORD:-atletatrack}@db:5432/atletatrack
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
      - model_cache:/app/.model_cache

  # ===== Frontend React/Nginx =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: atletatrack-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
  model_cache:

networks:
  default:
    name: atletatrack-network
