  <line x1="225" y1="390" x2="225" y2="408" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="675" y1="390" x2="675" y2="408" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Patterns legend -->
  <text x="20" y="494" font-size="10" font-weight="700" fill="#e8eaf0">Padroes utilizados:</text>
