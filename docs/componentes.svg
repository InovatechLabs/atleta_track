  <text x="36" y="511" font-size="9" fill="#6b7280">MVC — separacao View / Controller / Model</text>
  <rect x="280" y="502" width="10" height="10" rx="2" fill="#BA7517"/>
  <text x="296" y="511" font-size="9" fill="#6b7280">Strategy — algoritmos ML intercambiaveis (K-Means / IsoForest)</text>
