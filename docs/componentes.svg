  <text x="296" y="529" font-size="9" fill="#6b7280">Observer — AnomalyService notifica AlertService e frontend</text>
  <text x="880" y="549" text-anchor="end" font-size="9" fill="#374151">AtletaTrack v1.0 — RP06, RP07</text>
